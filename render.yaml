services:
  - type: web
    name: agriguard-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: agriguard-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: DATABASE_URL
        sync: false
      - key: OPEN_METEO_ENABLED
        value: "true"
      - key: CDSE_CLIENT_ID
        sync: false
      - key: CDSE_CLIENT_SECRET
        sync: false

  - type: web
    name: agriguard-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: agriguard-api
          envVarKey: RENDER_EXTERNAL_URL
